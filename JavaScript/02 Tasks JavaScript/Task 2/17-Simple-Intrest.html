<pre>
Task 17 — Simple Interest

Create a function calculateSimpleInterest(principal, rate, time).

Formula:

SI = (Principal × Rate × Time) / 100
Return the calculated simple interest.
</pre>

<script>

    function calculateSimpleInterest(principal, rate, time){

        console.log("The principal amount is: ", principal);
        console.log("The rate amount is: ", rate = principal * rate/100);
        console.log("The time(years) amount is: ", time);
        
        console.log("The Simple Intrest is: ",principal * rate * time);
    }

    calculateSimpleInterest(10000, 50, 2);

</script>
