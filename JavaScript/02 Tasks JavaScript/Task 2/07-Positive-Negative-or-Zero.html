<pre>
Task 7 — Positive, Negative or Zero

Create a function checkNumber(number) that checks whether a number is:

Positive
Negative
Zero
</pre>

<script>

    function checkNumber(number){

        if(number>0){
            console.log("Number is Positive!");
        }
        else if(number==0){
            console.log("Number is 0(ZERO)");
        }
        else{
            console.log("Number is Negative");
        }
    }

    checkNumber(15);

</script>
