Task 1 — Greeting Function

Create a function greetUser() that prints:

Welcome to JavaScript Programming!
Call the function three times.
</pre>

<script>

    function greetUser(){
        console.log("Welcome to JavaScript Programming!");
    }

    greetUser();
    greetUser();
    greetUser();    

</script>
