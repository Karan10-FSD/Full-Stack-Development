<pre>
Task 18 — Temperature Conversion

Create a function convertCelsiusToFahrenheit(celsius).

Formula:

Fahrenheit = (Celsius × 9/5) + 32
Return the Fahrenheit temperature.
</pre>

<script>

    function convertCelsiusToFahrenheit(celsius){
        console.log("The Fahrenheit is: ", Fahrenheit = (Celsius * 9/5) + 32);
    }

    convertCelsiusToFahrenheit(20);

</script>
