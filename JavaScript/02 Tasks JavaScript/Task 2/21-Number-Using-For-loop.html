<pre>
Task 21 — Print Numbers Using Function and For Loop

Create a function printNumbers(n) that prints numbers from 1 to n using a for loop.

Example
Input: 5

Output:
1
2
3
4
5
</pre>

<script>

function printNumbers(n){
    for(i=0; i<=n; i++){
        console.log(i);
    }
}

printNumbers(25);

</script>
