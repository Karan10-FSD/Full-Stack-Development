<pre>
Task 16 — Rectangle Area

Create a function calculateArea(length, width) that returns the area of a rectangle.

Formula:

Area = length × width
Print the returned result.
</pre>

<script>

    function calculateArea(length, width){
        console.log("The Length of the Rectangle is: ", length);
        console.log("The width of the Rectangle is: ", width);
        console.log("The Area of the Rectangle is: ", length * width);
    }

    calculateArea(15, 30);

    

</script>
