<pre>
Task 6 — Even or Odd

Create a function checkEvenOdd(number).

The function should determine whether the given number is:

Even
Odd
Example
Input: 17
Output: 17 is Odd
</pre>

<script>

    function checkEvenOdd(number){


        if(number%2==0){
            console.log("The number is Even "+ number);
        }
        else{
            console.log("The number is odd "+ number);
        }

    }

            checkEvenOdd(22);


</script>
