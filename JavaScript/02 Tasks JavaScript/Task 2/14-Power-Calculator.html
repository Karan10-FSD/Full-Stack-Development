<pre>
Task 14 — Power Calculator

Create a function:

calculatePower(number, power = 2)
Return the result.

Example
calculatePower(5)
Output: 25

calculatePower(5, 3)
Output: 125
</pre>

<script>

function calculatePower(number, power = 4){
    console.log("The number is: ",number);
    console.log("The Power is: ",power);
    console.log("The Answer is: ",power = number ** power);
    
}

calculatePower(5);

function calculatePower1(number, power){
    console.log("The number is: ",number);

}

calculatePower1(4, 2);

</script>
