Task 13 — Calculate Price with Default Discount

Create a function:

calculatePrice(price, discount = 10)
The function should calculate the final price after applying the discount.

A custom discount
No discount argument

<script>

function calculatePrice(price, discount = 10){
    console.log("The price of item: ",price);
    console.log("The discount of item: ",discount = price * discount/100);
}

calculatePrice(500);
