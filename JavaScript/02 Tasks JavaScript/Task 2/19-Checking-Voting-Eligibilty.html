<pre>
Task 19 — Check Voting Eligibility

Create a function checkVotingEligibility(age).

Rules:

Age >= 18 → Eligible
Age < 18 → Not Eligible
Return the result.


</pre>

<script>

    function checkVotingEligibility(age){
        
        if(age >= 18){
            console.log("Your are Eligible for Voting");
        }
        else{
            console.log("You are not Eligible for Voting");
        }

    }

    checkVotingEligibility(20);

</script>
