<pre>
Task 9 — Pass or Fail

Create a function checkResult(marks).

Rules:

Marks >= 40 → Pass
Marks < 40 → Fail
Return the result from the function.
</pre>
    
<script>

    function checkResult(marks){

        if(marks >= 40){
            console.log("Pass");
        }
        else{
            console.log("Fail");
        }
    }

    checkResult(10);

</script>
