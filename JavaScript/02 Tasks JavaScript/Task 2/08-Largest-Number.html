Task 8 — Find Largest Number

Create a function findLargest(a, b, c) that accepts three numbers and returns the largest number.

Example
Input: 25, 45, 30
Output: 45
</pre>
    
<script>

    function findLargest(a, b, c){

        if(a>b && a>c){
            console.log("A is Greatest");
        }
        else if(b>a && b>c){
            console.log("B is Greatest");
        }
        else{
            console.log("C is Greatest");
        }

    }

    findLargest(15, 26, 89);

</script>
