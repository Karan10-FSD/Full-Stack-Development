<pre>
Task 11 — Default Greeting

Create a function:

greetUser(name = "Guest")
If no argument is provided, the function should return:
Hello, Guest!

If a name is provided, it should return:

Hello, Rahul!
Test both cases.
</pre>

<script>
    
    function greetUser(name = "Guest"){
        console.log("Hello,",name);
    }

    greetUser();


    function greetUser1(name){
        console.log("Hello,",name);
    }

    greetUser1("Karan");

</script>
