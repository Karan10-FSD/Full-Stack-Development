Task 15 — Employee Information 

Create a function:

employeeInfo(name, department = "IT", salary = 30000)
Return a sentence containing the employee's information.

Test the function using different combinations of arguments.

<script>

function employeeInfo(name, department = "IT", salary = 30000){

}

employeeInfo("Karan");
