Task 12 — Default Country
Create a function:

displayUser(name, country = "India")
The function should return the user's name and country.

Test the function:

With both arguments
With only the name
</pre>

<script>

function displayUser(name, country = "India"){
    console.log("The name is: ",name ," \nThe country is: ",country);
}

displayUser("Karan");

function displayUser1(name, country){
    console.log("The name is: ", name);
    console.log("The country is: ", country);
}

displayUser1("Karan", "India");

</script>
