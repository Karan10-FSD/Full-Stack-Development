<body>
<pre>
Task 5 — Data Type Identification


Create variables containing:

A person's name
An age
A salary
A boolean value
null
undefined
Display each value along with its data type using typeof.
</pre>

<script>
    let person_name = "Karan";
    let person_age = 20;
    let person_salary = 2500;
    let person_healthy = true;
    let person_wife = null;
    let person_wealth = undefined;
    
    console.log("The person Name is:",person_name," , The type of name(variable) is:",typeof(person_name));
    console.log("The person Age is:",person_age," , The type of age(variable) is:",typeof(person_age));
    console.log("The person Salary is:",person_salary," , The type of salary(variable) is:",typeof(person_salary));
    console.log("The person Health is:",person_healthy," , The type of Health(variable) is:",typeof(person_healthy));
    console.log("The person Wife is:",person_wife," , The type of Wife(variable) is:",typeof(person_wife));
    console.log("The person Wealth is:",person_wealth," , The type of Wealth(variable) is:",typeof(person_wealth));

</script>
</body>
</html>
