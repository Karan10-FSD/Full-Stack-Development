    <pre>
Task 21 — Positive, Negative or Zero
Create a variable containing a number.

Using if...else if...else, determine whether the number is:

Positive
Negative
Zero
    </pre>

    <script>
        let num = 10;

        if(num>0){
            console.log("Number is Positive");
        }
        else if(num<0){
            console.log("Number is Negative");
        }
        else{
            console.log("Number is 0")
        }
    </script>

</body>
