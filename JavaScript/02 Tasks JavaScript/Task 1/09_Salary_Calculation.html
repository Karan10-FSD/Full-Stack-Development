<body>
<pre>
Task 9 — Salary Calculation


An employee has a basic salary of 30000.

Calculate:

HRA = 20% of basic salary
DA = 10% of basic salary
Total salary
Display all three values.
</pre>

<script>
    let basic_sal = 30000;

    let hra = basic_sal * 30/100;
    let da = basic_sal * 10/100;

    let tot_sal = basic_sal + hra + da;

    console.log("The Basic Salary is:",basic_sal);
    console.log("The HRA is:",hra);
    console.log("The DA is",da);
    console.log("The Total Salary of Employee is:",tot_sal);

</script>
</body>
