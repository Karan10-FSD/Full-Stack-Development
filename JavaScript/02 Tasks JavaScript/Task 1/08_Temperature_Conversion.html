<pre>
Task 8 — Temperature Conversion


Create a variable containing a temperature in Celsius.

Convert it into Fahrenheit using:

Fahrenheit = (Celsius × 9/5) + 32
Display the result.
</pre>

<script>
    let temp_cel = 40;

    let fahrenheit = (temp_cel * 9/5) + 32;
    
    console.log("After conversing the Temperature from Celsius to Fahrenheit is:",fahrenheit);
</script>
