    <pre>
Task 26 — Smallest of Three Numbers
Create three number variables.

Using conditional statements, find and display the smallest number.
    </pre>
    
<script>

    let num1 = 55;
    let num2 = 75;
    let num3 = 95;

    if(num1 < num2 && num1 < num3){
        console.log("Num1 is Smallest")
    }
    else if(num2 < num1 && num2 < num3){
        console.log("Num2 is Smallest")
    }
    else{
        console.log("Num3 is Smallest")
    }


</script>
