<body>
<pre>
Task 13 — Increment & Decrement


Create:

let points = 100;
Perform the following operations one by one:

Increase points by 20
Increase points by 15
Decrease points by 10
Decrease points by 25
Display the value after every operation.
</pre>

<script>

    let points = 100;

    console.log("Original Points are:",points);

    points += 20;
    console.log("When points increased by 20:",points);

    points += 15;
    console.log("When points again increased by 15:",points);

    points -= 10;
    console.log("When points decreased by 10:",points);

    points -= 25;
    console.log("When points again decreased by 25:",points);

</script>
    
</body>
