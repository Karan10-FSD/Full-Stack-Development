<pre>
Task 25 — Largest of Three Numbers
Create three number variables.

Using conditional statements, find and display the largest number.
</pre>

<script>
    let num1 = 55;
    let num2 = 75;
    let num3 = 95;

    if(num1 > num2 && num2 > num3){
        console.log("Num1 is Biggest")
    }
    else if(num1 < num2 && num2 > num3){
        console.log("Num2 is Biggest")
    }
    else{
        console.log("Num3 is Biggest")
    }

</script>
