<pre>
Task 11 — Discount Calculation


A product costs ₹8,000.

A discount of 15% is applied.

Calculate and display:

Discount amount
Final price
</pre>

<script>
    let prod = 8000;

    let discount = prod * 15/100;

    console.log("The Product Cost is:",prod);
    console.log("The Product Discount is:",discount);
    console.log("The Product final price after Discout is:",prod - discount);
    

</script>
