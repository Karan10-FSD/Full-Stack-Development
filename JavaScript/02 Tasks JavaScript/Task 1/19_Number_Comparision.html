<pre>
Task 19 — Number Comparison


Create two number variables.

Display:

Whether the first number is greater than the second
Whether the first number is smaller than the second
Whether both numbers are equal
</pre>

<script>

    let a = 20;
    let b = 10;

    if(a<b){
        console.log("B is bigger");
    }

    else if (a==b) {
        console.log("A and B both are EQUAL");
        
    } else {
        console.log("A is bigger")
        
    }

</script>
