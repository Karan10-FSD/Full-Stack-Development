<pre>
Task 14 — Assignment Operators
Create:

let balance = 5000;
Using assignment operators, perform:

1.Add 1500
2.Subtract 800
3.Multiply by 2
4.Divide by 4
5.Display the final balance.
</pre>

<script>
    let balance = 5000;
    console.log("The balance is:",balance)

    balance = balance + 1500;
    console.log("After adding balance by 1500:",balance);

    balance = balance - 800;
    console.log("After substracting balance by 800::",balance);

    balance = balance * 2;
    console.log("After multiplying balance by 2:",balance);

    balance = balance/4;
    console.log("After dividing the balance by 4:",balance);
    
    console.log("Also the Final Balance is:",balance);

</script>


</body>
