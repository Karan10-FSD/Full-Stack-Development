<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <center><h1>Calculator</h1></center>
    
<main>

    <input type="number" placeholder="Enter Number 1" id="num1" class="inp">
<br>
    <input type="number" placeholder="Enter Number 2" id="num2" class="inp">

    <button id="add" onclick="getInpData()">+</button>

    <button id="sub" onclick="getInpData1()">-</button>

    <button id="mul" onclick="getInpData2()">*</button>

    <button id="div" onclick="getInpData3()">/</button>

    <h1 id="res"></h1>


</main>


<script>

    let add = document.getElementById("add");
    function getInpData(){
        let num2 = parseInt( document.getElementById("num2").value);
        let num1 = parseInt( document.getElementById("num1").value);

        res.innerText = num1 + num2;
    }

    let sub = document.getElementById("sub");
     function getInpData1(){
        let num2 = parseInt( document.getElementById("num2").value);
        let num1 = parseInt( document.getElementById("num1").value);

        res.innerText = num1 - num2;
    }

     let mul = document.getElementById("mul");
     function getInpData2(){
        let num2 = parseInt( document.getElementById("num2").value);
        let num1 = parseInt( document.getElementById("num1").value);

        res.innerText = num1 * num2;
    }

     let div = document.getElementById("div");
     function getInpData3(){
        let num2 = parseInt( document.getElementById("num2").value);
        let num1 = parseInt( document.getElementById("num1").value);

        res.innerText = num1 / num2;
    }

</script>
</body>
</html>
