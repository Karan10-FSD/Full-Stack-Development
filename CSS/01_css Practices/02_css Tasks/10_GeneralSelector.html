<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Sibling Selector</title>
    <!-- General Sibling Selector  -->
     <style>
        h1 ~ p{
            color:peru;
            border:2px solid black;
        }
     </style>
</head>
<body>
    <h1>Hello h1</h1>
    <p>This is first paragraph after h1 or heading</p>
    <p>This is Second paragraph after h1 or heading</p>
    <p>This is Third paragraph after h1 or heading</p>
</body>
</html>
