<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PseudoClass Selector</title>
    <style>
        button{
            background-color: green;
            color:white;
        }
        button:hover{
            background-color: red;
            color:black;
        }
    </style>
</head>
<body>
    <button>Click me1</button><br><br>
    <button>Click me2</button><br><br>
    <button>Click me3</button>
</body>
</html>
