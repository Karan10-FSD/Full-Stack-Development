<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nth Child</title>
    <!-- Nth Child -->
     <style>
        li:nth-child(2){
            color:red;
        }
        li:nth-child(4){
            color: blue;
        }
        li:nth-child(6){
            color:green;
        }
     </style>
</head>
<body>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
    </ol>
</body>
</html>
