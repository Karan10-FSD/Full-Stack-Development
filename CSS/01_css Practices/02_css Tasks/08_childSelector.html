<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Selector</title>
    <!-- Inline CSS -->
  <style>   div > p{
        color:rgb(218, 7, 42);
        background-color: gold;
     }
     </style>
</head>
<body>
    <div>
        <p>
            This is the direct Child paragraph.
        </p>
         <section>
        <p>
            This is not the direct child paragraph. 
        </p>
    </section>
    </div>
</body>
</html>
