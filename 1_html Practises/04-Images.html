<!DOCTYPE html>
 <html lang="en">
     <head> 
        <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Images</title>
     </head>
<body>

<h1>HTML Images</h1>

<!-- alt describes the image when it cannot be displayed -->

<h2>Basic Image</h2>

<img src="images/mountain.jpg" alt="Snow covered mountain" width="500" height="300">

<h2>Figure and Caption</h2>

<figure>

    <img src="images/forest.jpg" alt="Green forest surrounded by mountains" width="500" height="300">

    <figcaption>
        A forest landscape during the morning.
    </figcaption>

</figure>

<h2>Image as a Link</h2>

<a href="gallery.html">
    <img src="images/gallery.jpg"
         alt="Open the photo gallery"
         width="300"
         height="200">
</a>

<h2>Lazy Loading</h2>

<img src="images/city.jpg"
     alt="City skyline"
     width="500"
     height="300"
     loading="lazy">

<h2>Responsive Images</h2>

<!-- picture allows different images to be selected
     depending on the available screen conditions -->

<picture>

    <source
        media="(min-width: 1000px)"
        srcset="images/large.jpg">

    <source
        media="(min-width: 600px)"
        srcset="images/medium.jpg">

    <img
        src="images/small.jpg"
        alt="Landscape viewed from a hill">

</picture>

<h2>Different Image Resolutions</h2>

<img
    src="images/photo-800.jpg"
    srcset="
        images/photo-400.jpg 400w,
        images/photo-800.jpg 800w,
        images/photo-1200.jpg 1200w
    "
    sizes="
        (max-width: 600px) 400px,
        (max-width: 1000px) 800px,
        1200px"
    alt="Lake surrounded by mountains">

</body>
</html>
