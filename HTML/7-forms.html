<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Practice</title>
</head>

<body>

    <main>

        <h1>Developer Registration</h1>

        <form action="/submit" method="post">

            <fieldset>

                <legend>Personal Information</legend>

                <p>
                    <label for="full-name">Full Name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="full_name"
                        required
                        autocomplete="name"
                    >
                </p>

                <p>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </p>

                <p>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        required
                    >
                </p>

                <p>
                    <label for="birth-date">Date of Birth</label>
                    <input
                        type="date"
                        id="birth-date"
                        name="birth_date"
                    >
                </p>

            </fieldset>

            <fieldset>

                <legend>Developer Preferences</legend>

                <p>Preferred role:</p>

                <label>
                    <input
                        type="radio"
                        name="role"
                        value="frontend"
                    >
                    Frontend Developer
                </label>

                <label>
                    <input
                        type="radio"
                        name="role"
                        value="backend"
                    >
                    Backend Developer
                </label>

                <label>
                    <input
                        type="radio"
                        name="role"
                        value="fullstack"
                    >
                    Full Stack Developer
                </label>

                <p>Technologies:</p>

                <label>
                    <input
                        type="checkbox"
                        name="technology"
                        value="html"
                    >
                    HTML
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="technology"
                        value="javascript"
                    >
                    JavaScript
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="technology"
                        value="react"
                    >
                    React
                </label>

                <p>

                    <label for="experience">
                        Experience Level
                    </label>

                    <select id="experience" name="experience">

                        <option value="">
                            Select one
                        </option>

                        <option value="beginner">
                            Beginner
                        </option>

                        <option value="intermediate">
                            Intermediate
                        </option>

                        <option value="advanced">
                            Advanced
                        </option>

                    </select>

                </p>

                <p>

                    <label for="message">
                        Why do you want to become a developer?
                    </label>

                    <br>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="50"
                    ></textarea>

                </p>

            </fieldset>

            <button type="submit">
                Register
            </button>

            <button type="reset">
                Reset
            </button>

        </form>

    </main>

</body>
</html>
