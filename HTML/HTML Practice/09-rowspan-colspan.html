<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timetable</title>
</head>
<body>

    <h1>Weekly Timetable</h1>

    <table border="1">

        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>CSS</td>
            <td>JavaScript</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Python</td>
            <td colspan="2">Project Work</td>
        </tr>

        <tr>
            <td rowspan="2">Wednesday</td>
            <td>Java</td>
            <td>Database</td>
            <td>Networking</td>
        </tr>

        <tr>
            <td colspan="3">Practical Session</td>
        </tr>

    </table>

</body>
</html>
