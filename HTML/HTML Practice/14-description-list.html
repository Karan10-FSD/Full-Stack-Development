<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Glossary</title>
</head>
<body>

    <h1>Web Development Glossary</h1>

    <dl>

        <dt>HTML</dt>
        <dd>
            HyperText Markup Language used to structure web pages.
        </dd>

        <dt>CSS</dt>
        <dd>
            Cascading Style Sheets used to style web pages.
        </dd>

        <dt>JavaScript</dt>
        <dd>
            A programming language commonly used to add
            interactivity to web pages.
        </dd>

        <dt>Browser</dt>
        <dd>
            Software used to access and display websites.
        </dd>

    </dl>

</body>
</html>
