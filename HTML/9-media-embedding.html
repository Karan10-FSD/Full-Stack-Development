<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media and Embedding</title>
</head>

<body>

    <main>

        <h1>Media Practice</h1>

        <section>

            <h2>Audio</h2>

            <audio controls>

                <source
                    src="media/audio.mp3"
                    type="audio/mpeg"
                >

                Your browser does not support audio.

            </audio>

        </section>

        <section>

            <h2>Video</h2>

            <video
                controls
                width="640"
                height="360"
                poster="images/poster.jpg"
            >

                <source
                    src="media/tutorial.mp4"
                    type="video/mp4"
                >

                Your browser does not support video.

            </video>

        </section>

        <section>

            <h2>Embedded Website</h2>

            <iframe
                src="https://example.com"
                title="Example website"
                width="800"
                height="400"
            >
            </iframe>

        </section>

    </main>

</body>
</html>
