<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>HTML Forms</title> </head> <body>
<!-- Forms collect information from users. -->

<h1>HTML Forms</h1>

<h2>Basic Form</h2>

<form action="/submit" method="post">

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name">

    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">

    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">

    <br><br>

    <button type="submit">Submit</button>

</form>

<h2>Different Input Types</h2>

<form>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age">

    <br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob">

    <br><br>

    <label for="website">Website:</label>
    <input type="url" id="website" name="website">

    <br><br>

    <label for="color">Favorite Color:</label>
    <input type="color" id="color" name="color">

    <br><br>

    <label for="resume">Resume:</label>
    <input type="file" id="resume" name="resume">

</form>

<h2>Radio Buttons and Checkboxes</h2>

<form>

    <p>Choose your experience level:</p>

    <input type="radio" id="beginner" name="level" value="beginner">
    <label for="beginner">Beginner</label>

    <input type="radio" id="intermediate" name="level" value="intermediate">
    <label for="intermediate">Intermediate</label>

    <input type="radio" id="advanced" name="level" value="advanced">
    <label for="advanced">Advanced</label>

    <p>Technologies you know:</p>

    <input type="checkbox" id="html" name="technology" value="html">
    <label for="html">HTML</label>

    <input type="checkbox" id="css" name="technology" value="css">
    <label for="css">CSS</label>

    <input type="checkbox" id="js" name="technology" value="javascript">
    <label for="js">JavaScript</label>

</form>

<h2>Select and Textarea</h2>

<form>

    <label for="country">Country:</label>

    <select id="country" name="country">
        <option value="">Select a country</option>
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">United Kingdom</option>
        <option value="canada">Canada</option>
    </select>

    <br><br>

    <label for="message">Message:</label>

    <textarea id="message"
              name="message"
              rows="5"
              cols="40"
              placeholder="Write your message here..."></textarea>

</form>

</body> </html>
