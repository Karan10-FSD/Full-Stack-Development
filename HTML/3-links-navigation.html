<!DOCTYPE html>

            <p>
                Email:
                <a href="mailto:example@email.com">

                </a>
            </p>

                    +91 12345 67890
                </a>
            </p>
        </section>

    </main>

    <footer>
        <a href="#">Back to Top</a>
    </footer>

</html>
