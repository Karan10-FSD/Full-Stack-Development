<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Practice page demonstrating a properly structured HTML document."
    >

    <meta name="author" content="Your Name">

    <title>HTML Document Structure</title>
</head>

<body>

    <header>
        <h1>HTML Document Structure</h1>
        <p>Learning how a complete HTML document is organized.</p>
    </header>

    <main>

        <section>
            <h2>Document Components</h2>

            <article>
                <h3>Head Section</h3>
                <p>
                    The head contains metadata, the document title,
                    character encoding and other information.
                </p>
            </article>

            <article>
                <h3>Body Section</h3>
                <p>
                    The body contains the visible content of the webpage.
                </p>
            </article>
        </section>

    </main>

    </footer>

</body>
</html>
