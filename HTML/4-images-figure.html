<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images and Figures</title>
</head>

<body>

    <main>

        <h1>Image Practice</h1>

        <figure>

            <img
                src="images/web-development.jpg"
                alt="Laptop displaying a web development project"
                width="800"
                height="450"
            >

            <figcaption>
                A workspace used for web development.
            </figcaption>

        </figure>

        <section>

            <h2>Responsive Image</h2>

            <picture>

                <source
                    media="(min-width: 1000px)"
                    srcset="images/large.jpg"
                >

                <source
                    media="(min-width: 600px)"
                    srcset="images/medium.jpg"
                >

                <img
                    src="images/small.jpg"
                    alt="Responsive example image"
                >

            </picture>

        </section>

    </main>

</body>
</html>
