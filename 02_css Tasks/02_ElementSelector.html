<html lang="en">
<head>

    <title>Element Selector</title>
    <style>
        h2{
            font-size: 60px;
        }
        p{
            color: brown;
        }
        button{
            background-color: blueviolet;
        }

</head>
<body>

    <h2>Hello World</h2>
    <h3>Hello World</h3>

    <p>This is Paragraph3 of the world</p>


    <button>Click Me!</button>
</body>
</html>
